[package]
name = "xc-shell-supervisor"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
