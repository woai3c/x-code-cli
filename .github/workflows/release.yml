name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

# Authenticate @vscode/ripgrep's postinstall against the GitHub API to
# avoid the 60 req/h anonymous rate limit shared across Actions runners.
# Same reasoning as pr-check.yml — see the note there.
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Run deterministic release gate
        run: pnpm run ci

      - name: Copy README and LICENSE into packages
        run: |
          cp LICENSE packages/core/LICENSE
          cp LICENSE packages/cli/LICENSE
          cp README.md packages/cli/README.md
          cp README.zh-CN.md packages/cli/README.zh-CN.md

      - name: Check CLI package
        run: pnpm check:package

      - name: Pack packages
        run: |
          mkdir release-packages
          (cd packages/core && pnpm pack --pack-destination ../../release-packages)
          (cd packages/cli && pnpm pack --pack-destination ../../release-packages)

      - name: Smoke test CLI package
        shell: bash
        run: |
          cli_tgz="$(find "$GITHUB_WORKSPACE/release-packages" -name 'x-code-cli-cli-*.tgz' -print -quit)"
          test -n "$cli_tgz"
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          npm install --prefix "$smoke_dir" "$cli_tgz"
          "$smoke_dir/node_modules/.bin/xc" --version
          "$smoke_dir/node_modules/.bin/x-code" --help >/dev/null
          (cd "$smoke_dir" && node -e "require.resolve('undici')")

      - name: Publish to npm
        run: |
          for tgz in "$GITHUB_WORKSPACE"/release-packages/*.tgz; do
            npx --yes --package npm@11 npm publish "$tgz" --provenance --access public
          done

      - name: Extract latest changelog section
        run: awk '/^## v/{c++} c==1' CHANGELOG.md > RELEASE_NOTES.md

      - name: Append contributors to release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          prev_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname \
            | grep -v "^${tag}$" | head -1 || true)"
          range="${prev_tag:+${prev_tag}..}${tag}"

          contributors="$(
            git log --no-merges --pretty='format:%aN%x1f%aE' "$range" \
              | awk -F$'\x1f' '!seen[tolower($2)]++ { print $1 "\x1f" $2 }' \
              | sort -t$'\x1f' -k1,1f \
              | while IFS=$'\x1f' read -r name email; do
                  gh_user="$(
                    gh api "/search/users?q=${email}+in:email" \
                      --jq '.items[0].login // empty' 2>/dev/null || true
                  )"
                  if [ -n "$gh_user" ]; then
                    echo "- @${gh_user}"
                  else
                    echo "- ${name}"
                  fi
                done
          )"

          if [ -n "$contributors" ]; then
            printf '\n## Contributors\n\n%s\n' "$contributors" >> RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
